<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08a6a0"><link rel="manifest" href="../../manifest.webmanifest"><link rel="apple-touch-icon" href="../../assets/icon-192.png">
<meta name="studymap-root" content="../../">
<title>名産品を学ぶ | StudyMap</title>
<link rel="stylesheet" href="../../core/studymap.css">
<style>
html,body{height:100%}
body{overflow:hidden}
.sm-header{position:relative}


.learn-shell{
  width:min(1240px,100%);height:calc(100vh - 74px);margin:0 auto;padding:14px;
  display:grid;grid-template-columns:285px minmax(0,1fr);gap:14px
}
.pref-list{overflow:auto;padding:10px}
.pref-button{
  width:100%;border:0;background:#f5fbfb;color:var(--sm-text);
  padding:10px 12px;margin-bottom:6px;border-radius:12px;
  font-weight:900;text-align:left;cursor:pointer
}
.pref-button.active{background:var(--sm-main);color:white}
.learn-main{
  min-width:0;min-height:0;display:flex;flex-direction:column;
  padding:18px;overflow:hidden
}
.learn-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:12px
}
.learn-head h1{margin:0;font-size:32px}
.region{color:var(--sm-muted);font-weight:900}
.item-grid{
  flex:1;min-height:0;display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));gap:14px
}
.specialty-card{
  min-width:0;border-radius:22px;background:linear-gradient(180deg,#fff,#f8ffff);
  border:1px solid #d9eeee;display:flex;flex-direction:column;
  overflow:hidden;text-align:center
}
.specialty-image{
  width:100%;height:min(32vh,280px);background:#edfafa;
  display:flex;align-items:center;justify-content:center;overflow:hidden
}
.specialty-image img{width:100%;height:100%;object-fit:contain}
.no-photo{
  color:#7a8e93;font-weight:900;font-size:17px;
  display:flex;flex-direction:column;gap:8px;align-items:center
}

.card-copy{
  flex:1;padding:16px 16px 18px;display:flex;flex-direction:column;
  align-items:center;justify-content:center
}
.specialty-card h2{margin:0 0 8px;font-size:26px;line-height:1.2}
.ai-image-label{margin:0 0 8px;color:#657b80;font-size:12px;line-height:1.4}
.description{
  margin:0;color:#516970;font-weight:800;font-size:14px;line-height:1.55
}
.nav-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.nav-row button{
  min-width:120px;border:0;padding:10px 16px;border-radius:14px;
  font-weight:900;font-size:16px;cursor:pointer
}
.prev{background:#e8f8f7;color:var(--sm-text)}
.next{background:var(--sm-main);color:white}
.credit-link{
  color:#657b80;text-decoration:none;font-size:12px;font-weight:800
}
@media(max-width:900px){
  body{overflow:auto}.sm-header-title{font-size:21px}
  
  .learn-shell{height:auto;grid-template-columns:1fr}
  .pref-list{display:flex;overflow:auto;gap:6px;padding:8px}
  .pref-button{width:auto;min-width:max-content;margin:0}
  .item-grid{grid-template-columns:1fr}
  .specialty-image{height:230px}
}
</style>
</head>
<body>
<header class="sm-header has-audio">
<a class="sm-back" href="genre.html?type=specialty&name=名産品">←</a>
<div class="sm-header-title">名産品を学ぶ</div>

<div class="sm-audio-controls"><button class="sm-audio-btn" data-studymap-bgm>♪ BGM OFF</button><button class="sm-audio-btn" data-studymap-sfx>🔊 効果音 ON</button></div></header>
<main class="learn-shell">
<aside class="sm-card pref-list" id="prefList"></aside>
<section class="sm-card learn-main">
<div class="learn-head"><div><div class="sm-breadcrumb">StudyMap ＞ 小学生コース ＞ 日本地理 ＞ 名産品 ＞ 学ぶ</div><h1 id="prefName">読み込み中</h1></div><div class="region" id="region"></div></div>
<div class="item-grid" id="itemGrid"></div>
<div class="nav-row">
<button class="prev" id="prevBtn">← 前の県</button>
<a class="credit-link" href="image-credits.html">画像の出典・ライセンス</a>
<button class="next" id="nextBtn">次の県 →</button>
</div>
</section>
</main>
<script src="data/specialties.js"></script>
<script>
let data=[],index=0;
function renderList(){const box=document.getElementById("prefList");box.innerHTML="";data.forEach((p,i)=>{const b=document.createElement("button");b.className="pref-button"+(i===index?" active":"");b.textContent=p.prefecture;b.onclick=()=>{index=i;render()};box.appendChild(b)})}
function render(){const p=data[index];document.getElementById("prefName").textContent=p.prefecture;document.getElementById("region").textContent=p.region;const grid=document.getElementById("itemGrid");grid.innerHTML="";p.items.forEach(item=>{const card=document.createElement("article");card.className="specialty-card";const image=document.createElement("div");
image.className="specialty-image";
const showNoPhoto=()=>{
  const empty=document.createElement("div");
  empty.className="no-photo";
  empty.textContent="写真なし";
  image.replaceChildren(empty);
};
if(item.image){
  const img=document.createElement("img");
  img.onerror=showNoPhoto;
  img.src="images/specialties/"+item.image;
  img.alt=item.name;
  image.appendChild(img);
}else{
  showNoPhoto();
}
const copy=document.createElement("div");
copy.className="card-copy";
const h=document.createElement("h2");
h.textContent=item.name;
const desc=document.createElement("p");
desc.className="description";
desc.textContent=item.description||"";
if(item.imageType==="ai"){
  const label=document.createElement("p");
  label.className="ai-image-label";
  label.textContent="AI生成（教材用イメージ）";
  copy.appendChild(label);
}
copy.append(h,desc);
card.append(image,copy);
grid.appendChild(card)});prevBtn.disabled=index===0;nextBtn.disabled=index===data.length-1;renderList();requestAnimationFrame(()=>document.querySelector(".pref-button.active")?.scrollIntoView({block:"nearest",inline:"nearest"}))}
prevBtn.onclick=()=>{if(index>0){index--;render()}};nextBtn.onclick=()=>{if(index<data.length-1){index++;render()}};
try{
  data = Array.isArray(window.SPECIALTY_DATA) ? window.SPECIALTY_DATA : [];
  if(!data.length) throw new Error("名産品データが空です");
  render();
}catch(e){
  document.getElementById("prefName").textContent = "データを読み込めませんでした";
  console.error(e);
}
</script>


<script src="../../core/pwa.js"></script><script src="../../core/bgm.js"></script><script src="../../core/sfx.js"></script></body></html>
